services:
  portfolio-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: yahya-portfolio-qwen-next:production
    container_name: yahya-portfolio-web
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - portfolio-network

  nginx:
    image: nginx:stable-alpine
    container_name: portfolio-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/portfolio-docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      portfolio-web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge
